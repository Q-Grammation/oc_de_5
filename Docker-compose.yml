version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_healthcare
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongodb_data:/data/db
  
  data_migrator:
    build: .
    container_name: data_migrator_healthcare
    depends_on:
      - mongodb
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      #Root
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      #Utilisateurs
      - MONGO_ADMIN1_PASS=${MONGO_ADMIN1_PASS}
      - MONGO_ADMIN2_PASS=${MONGO_ADMIN2_PASS}
      - MONGO_EDITOR1_PASS=${MONGO_EDITOR1_PASS}
      - MONGO_EDITOR2_PASS=${MONGO_EDITOR2_PASS}
      - MONGO_READER1_PASS=${MONGO_READER1_PASS}
      - MONGO_READER2_PASS=${MONGO_READER2_PASS}
    volumes:
      - ./migration/healthcare_dataset.csv:/app/healthcare_dataset.csv
    command: python /app/main.py

volumes:
  mongodb_data:
    name: "mongodb_volume_p5"
